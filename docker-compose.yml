services:
  bible:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - bible-data:/app/data
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://bible:bible@db:5432/bible
      - AUTH_SECRET=change-me-to-a-random-secret
      - AUTH_TRUST_HOST=true
      - ORIGIN=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: bible
      POSTGRES_DB: bible
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/migrations/0001_init/migration.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bible-data:
  pgdata:
